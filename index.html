<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>希土類デュアルユース・サプライチェーン監査</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#ffffff;--panel:#f6f7f8;--panel-hi:#e9edf1;--line:#c9d0d7;
  --text:#101418;--sub:#4f5b66;--faint:#727d87;
  --y:#007f73;--dytb:#6654cc;--sm:#9a5a00;--sc:#006cab;
  --risk-a:#c43d28;--risk-b:#506a80;--risk-c:#806b00;--risk-x:#727d87
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1317;--panel:#171c22;--panel-hi:#1e252d;--line:#2a323b;
    --text:#e9e6dd;--sub:#9aa3ac;--faint:#6b7681;
    --y:#5fd4c4;--dytb:#9d8cff;--sm:#f2b24e;--sc:#55a8e8;
    --risk-a:#e4573d;--risk-b:#8ca3b8;--risk-c:#e0c36a;--risk-x:#6b7681
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#rare-earth-original-flow{background:var(--bg);color:var(--text);min-height:100vh}
.re-shell{max-width:1640px;margin:0 auto;padding:30px 24px 56px}
.re-kicker{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.19em;color:var(--faint)}
.re-title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:30px;font-weight:500;margin:7px 0 0}
.re-header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.re-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:15px}
button{font:13px inherit;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover{background:var(--panel-hi);color:var(--text)}
button[aria-pressed="true"]{color:var(--text);border-color:var(--text);background:var(--panel-hi)}
button[data-element="Y"]{--re-filter-color:var(--y)}
button[data-element="DyTb"]{--re-filter-color:var(--dytb)}
button[data-element="Sm"]{--re-filter-color:var(--sm)}
button[data-element="Sc"]{--re-filter-color:var(--sc)}
button[data-element]:not([data-element="all"]){color:var(--re-filter-color);border-color:var(--re-filter-color)}
button[data-element]:not([data-element="all"]):hover{color:var(--re-filter-color);border-color:var(--re-filter-color);background:color-mix(in srgb,var(--re-filter-color) 14%,transparent)}
button[data-element]:not([data-element="all"])[aria-pressed="true"]{color:var(--bg);border-color:var(--re-filter-color);background:var(--re-filter-color)}
.re-status{font-size:12px;color:var(--faint);margin-left:auto}
.re-map-toolbar{display:flex;align-items:center;gap:12px;max-width:1500px;margin:12px auto 0}
.re-map-help{font-size:11px;color:var(--faint);line-height:1.45}
.re-flow-wrap{position:relative;overflow:visible;height:auto;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 35%,var(--bg))}
.re-flow-canvas{position:relative;isolation:isolate;width:1200px;min-height:0;margin:0}
.re-flow-svg{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
.re-path-bg{fill:none;stroke-width:7;stroke-linecap:round;opacity:.12}
.re-path-fg{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:4 8;opacity:.86}
.re-edge{transition:opacity .12s ease}
.re-flow-canvas.is-tracing .re-edge:not(.is-linked){opacity:0!important}
.re-route-note{margin:4px auto 0;max-width:1500px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px;color:var(--sub);font-size:11px;line-height:1.55}
.re-route-note-title{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;color:var(--faint);margin-bottom:5px}
.re-route-row{display:grid;grid-template-columns:minmax(220px,350px) 68px 1fr;gap:9px;align-items:start;padding:4px 0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.re-route-row:first-of-type{border-top:0}
.re-route-pair{color:var(--text)}
.re-route-elements{display:flex;gap:4px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
.re-card{position:absolute;z-index:1;border-radius:10px;background:var(--panel);border:1.5px solid var(--line);color:var(--text);padding:10px 12px;text-align:left;white-space:normal}
.re-card:hover{transform:translateY(-1px)}
.re-card[aria-pressed="true"]{background:var(--panel-hi);border-color:var(--text)}
.re-card.is-dim{opacity:.22}
.re-stage-card{width:168px;height:82px;padding:8px 10px}
.re-sub-card{width:168px;min-height:70px;padding:5px 8px 17px;overflow:hidden;transition:opacity .12s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease,transform .12s ease}
.re-sub-card.is-filter-match{background:var(--re-highlight-bg);border-color:var(--re-highlight-primary);box-shadow:0 0 0 1px color-mix(in srgb,var(--re-highlight-primary) 30%,transparent)}
.re-sub-card.is-filter-match::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--re-highlight-band)}
.re-sub-card.is-filter-match[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text),0 0 0 4px var(--re-highlight-primary)}
.re-card-code{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;color:var(--faint)}
.re-card-title{font-size:13px;font-weight:500;margin-top:7px;line-height:1.35}
.re-sub-card .re-card-code{font-size:9px;letter-spacing:.1em;white-space:nowrap}
.re-sub-card .re-card-title{font-size:11px;line-height:1.16;margin-top:3px;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.re-card-sub{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.35}
.re-card-description{font-size:9px;color:var(--faint);margin-top:2px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.re-card-count{position:absolute;right:8px;bottom:5px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--sub)}
.re-card-tags{position:absolute;left:9px;bottom:5px;display:flex;gap:4px;margin:0;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1;white-space:nowrap}
.re-stamp{position:absolute;border:1.5px solid var(--risk-a);color:var(--risk-a);border-radius:4px;padding:3px 8px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:11px;background:var(--bg)}
.re-column-label{position:absolute;top:4px;width:168px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.35;letter-spacing:.06em;color:var(--faint)}
.re-detail-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:18px 0 12px}
.re-detail-head h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;font-weight:500;margin:0}
.re-detail-head span{font-size:12px;color:var(--faint)}
.re-main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.re-company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.re-main.is-dependency{grid-template-columns:1fr}
.re-main.is-dependency #re-companies{display:block}
.re-main.is-dependency #re-dossier{display:none}
.re-dep-dashboard{display:grid;gap:14px}
.re-dep-intro{font-size:12px;color:var(--sub);line-height:1.65;max-width:920px}
.re-dep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.re-dep-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;min-width:0}
.re-dep-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.re-dep-element{display:flex;align-items:center;gap:8px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.re-dep-element i{width:9px;height:9px;border-radius:50%;flex:none}
.re-dep-badge{border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--sub);white-space:nowrap}
.re-dep-metric{font-size:11px;color:var(--sub);line-height:1.45;margin-top:5px;min-height:32px}
.re-dep-pie{position:relative;width:132px;height:132px;border-radius:50%;margin:13px auto 11px}
.re-dep-pie::after{content:"";position:absolute;inset:25px;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
.re-dep-pie-value{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;pointer-events:none}
.re-dep-pie-value strong{font:500 24px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1}
.re-dep-pie-value span{font-size:9px;color:var(--faint);margin-top:5px}
.re-dep-legend{display:grid;gap:4px;margin-top:4px}
.re-dep-legend-item{display:grid;grid-template-columns:9px 1fr auto;gap:6px;align-items:center;font-size:10px;color:var(--sub)}
.re-dep-legend-item i{width:8px;height:8px;border-radius:50%}
.re-dep-legend-item strong{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
.re-dep-evidence{font-size:12px;color:var(--sub);line-height:1.6}
.re-dep-source{display:inline-block;margin-top:5px;color:var(--text);font-size:11px;text-underline-offset:3px}
.re-dep-note{font-size:11px;color:var(--faint);line-height:1.65}
.re-company{border-radius:10px;background:var(--panel);color:var(--text);border:1.5px solid var(--line);border-top:3px solid var(--risk-a);padding:12px 14px;text-align:left}
.re-company[aria-pressed="true"]{background:var(--panel-hi)}
.re-company-name{font-size:14px;font-weight:500}
.re-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.re-tag{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.re-atla-badge{color:var(--text);border-style:solid;font-family:inherit;font-weight:500}
.re-company-pos{font-size:12px;color:var(--sub);line-height:1.55;margin-top:7px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.re-dossier{position:sticky;top:14px;border:1px solid var(--line);border-top:3px solid var(--risk-a);border-radius:12px;background:var(--panel);padding:18px}
.re-empty{border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--faint);font-size:13px}
.re-dossier-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.re-dossier-title strong{font-size:17px;font-weight:500}
.re-dossier-title span{font-size:11px}
.re-dossier dl{margin:14px 0 0}
.re-dossier-row{display:grid;grid-template-columns:96px 1fr;gap:10px;border-top:1px solid var(--line);padding:8px 0}
.re-dossier dt{font-size:12px;color:var(--faint)}
.re-dossier dd{margin:0;font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.re-more{margin-top:5px}
.re-more summary{width:max-content;color:var(--sc);font-size:11px;cursor:pointer}
.re-more div{margin-top:6px;color:var(--sub)}
@media(max-width:980px){.re-main{grid-template-columns:1fr}.re-dossier{position:static}}
@media(max-width:720px){.re-dep-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}}
@media(max-width:560px){.re-shell{padding:18px 12px 36px}.re-title{font-size:23px}.re-status{margin-left:0;width:100%}.re-company-grid{grid-template-columns:1fr}.re-route-row{grid-template-columns:1fr}.re-route-elements{margin-top:-5px}}
@media(prefers-reduced-motion:reduce){.re-card{transition:none}}
</style>
</head>

  function countSub(id){return visible().filter(function(c){return c.subs.indexOf(id)>=0}).length}
  function totalSubCount(id){return data.filter(function(c){return c.subs.indexOf(id)>=0}).length}
  function subElementCount(id,element){return data.filter(function(c){return c.subs.indexOf(id)>=0&&Array.isArray(c.tags)&&c.tags.indexOf(element)>=0}).length}
  function activeEls(item){var forced=item.forceEls||[];return item.els.filter(function(element){return forced.indexOf(element)>=0||subElementCount(item.id,element)>0})}

  function renderFlow(){
    var viewport=root.querySelector("#re-flow-viewport"),W=Math.max(1200,Math.floor(viewport.clientWidth));
    var sidePadding=Math.max(18,Math.min(60,Math.round(18+(W-1200)*.05)));
    var cardWidth=Math.max(168,Math.min(240,Math.round(168+(W-1200)*.092)));
    var columnStep=cardWidth+(W-sidePadding*2-cardWidth*6)/5;
    var minCardHeight=92,perCompany=3,columnGap=8;
    var xByStage={2:sidePadding+columnStep,3:sidePadding+columnStep*2,4:sidePadding+columnStep*3,5:sidePadding+columnStep*4,6:sidePadding+columnStep*5};
    var lane={Y:-6,DyTb:-2,Sm:2,Sc:6};
    var stageMeta={};stages.forEach(function(stage){stageMeta[stage.id]=stage});
    var columns=[
      {stage:2,items:commerceSubs.filter(function(item){return item.stage===2})},
      {stage:3,items:commerceSubs.filter(function(item){return item.stage===3})},
      {stage:4,items:parts},
      {stage:5,items:modules},
      {stage:6,items:systems}
    ];
    function orderNodes(column){
      var byId={};column.items.forEach(function(item){byId[item.id]=item});
      return (columnOrder[column.stage]||column.items.map(function(item){return item.id})).map(function(id){return byId[id]}).filter(Boolean)
    }
    columns.forEach(function(column){column.nodes=orderNodes(column)});
    function scaledHeight(item){return Math.round(minCardHeight+totalSubCount(item.id)*perCompany)}
    function columnSpan(nodes){return nodes.reduce(function(sum,item){return sum+scaledHeight(item)},0)+Math.max(0,nodes.length-1)*columnGap}
    var maxSpan=Math.max.apply(null,columns.map(function(column){return columnSpan(column.nodes)}));
    var H=Math.max(920,Math.ceil(maxSpan+80)),CY=H/2;
    var source={id:"stage01",x:sidePadding,w:cardWidth,y:CY,els:["Y","DyTb","Sm","Sc"]};
    function layoutColumn(nodes){
      var top=(H-columnSpan(nodes))/2;
      return nodes.map(function(item){var h=scaledHeight(item),position={item:item,h:h,y:top+h/2};top+=h+columnGap;return position})
    }
    var nodeMap={};
    columns.forEach(function(column){
      column.layout=layoutColumn(column.nodes);
      column.layout.forEach(function(position){
        var item=position.item;
        nodeMap[item.id]={id:item.id,x:xByStage[column.stage],w:cardWidth,y:position.y,h:position.h,els:activeEls(item),node:item};
      })
    });

    var svg='<svg class="re-flow-svg" viewBox="0 0 '+W+' '+H+'" role="img"><title>Stage 01から06までの希土類サプライチェーン・サブカテゴリー間フロー</title>';
    var edgeKeys=new Set();
    function connect(a,b,allowed,note){
      if(!a||!b)return;
      var common=Array.from(new Set(allowed||a.els)).filter(function(element){return a.els.indexOf(element)>=0&&b.els.indexOf(element)>=0});
      common.forEach(function(element){
        var edgeKey=a.id+"|"+b.id+"|"+element;
        if(edgeKeys.has(edgeKey))return;
        edgeKeys.add(edgeKey);
        var fromLabel=a.node?a.node.label:((stageMeta[1]||{}).label||"海外の資源・分離"),toLabel=b.node?b.node.label:b.id;
        var title=fromLabel+" → "+toLabel+" / "+tagLabel(element)+(note?" — "+note:"");
        svg+=path(curve(a.x+a.w,a.y+lane[element],b.x,b.y+lane[element]),colors[element],selectedElements.indexOf(element)<0,{from:a.id,to:b.id,element:element,title:title})
      })
    }
    columns.filter(function(column){return column.stage===2}).forEach(function(column){
      column.nodes.forEach(function(item){connect(source,nodeMap[item.id],nodeMap[item.id].els)})
    });
    columns.filter(function(column){return column.stage>2}).forEach(function(column){
      column.nodes.forEach(function(item){
        (item.src||[]).forEach(function(sourceId){connect(nodeMap[sourceId],nodeMap[item.id],item.srcEls&&item.srcEls[sourceId],item.srcNotes&&item.srcNotes[sourceId])})
      })
    });
    svg+='</svg>';

    function segmentedGradient(tags,angle,colorValue){
      if(tags.length===1)return colorValue(tags[0]);
      var stops=[];
      tags.forEach(function(tag,index){var start=index*100/tags.length,end=(index+1)*100/tags.length,color=colorValue(tag);stops.push(color+" "+start+"%",color+" "+end+"%")});
      return"linear-gradient("+angle+","+stops.join(",")+")"
    }
    function highlightVars(tags){
      if(!tags.length)return"";
      var band=segmentedGradient(tags,"90deg",function(tag){return colors[tag]});
      var background=segmentedGradient(tags,"135deg",function(tag){return"color-mix(in srgb,"+colors[tag]+" 15%,var(--panel))"});
      return";--re-highlight-primary:"+colors[tags[0]]+";--re-highlight-band:"+band+";--re-highlight-bg:"+background
    }
    function subCard(item,pos,stage){
      var dim=pos.els.length===0||!pos.els.some(function(element){return selectedElements.indexOf(element)>=0});
      var matchedEls=selectedElements.length===allElements.length?[]:pos.els.filter(function(element){return selectedElements.indexOf(element)>=0});
      var highlight=matchedEls.length>0;
      var routeTitle=(item.src||[]).map(function(sourceId){return(subLabel(sourceId)+" → "+item.label+" / "+(item.srcEls[sourceId]||[]).map(tagLabel).join("・")+" — "+item.srcNotes[sourceId])}).join("\n");
      return'<button type="button" class="re-card re-sub-card'+(dim?" is-dim":"")+(highlight?" is-filter-match":"")+(matchedEls.length>1?" is-filter-multi":"")+'" data-type="sub" data-id="'+item.id+'" data-node-id="'+item.id+'"'+(routeTitle?' title="'+esc(routeTitle)+'"':'')+' aria-pressed="'+(selection.type==="sub"&&selection.id===item.id)+'" style="left:'+pos.x+'px;top:'+(pos.y-pos.h/2)+'px;width:'+pos.w+'px;height:'+pos.h+'px'+highlightVars(matchedEls)+'">'+
        '<div class="re-card-code">STAGE '+stage.code+' / '+esc(stage.label)+'</div><div class="re-card-title">'+esc(item.label)+'</div><div class="re-card-description">'+esc(item.description)+'</div><div class="re-card-tags">'+tagsHtml(pos.els)+'</div><span class="re-card-count">'+totalSubCount(item.id)+'社</span></button>'
    }

    var sourceStage=stageMeta[1]||{code:"01",label:"海外の資源・分離",short:"採掘・分離精製・輸出管理"};
    var cards='';
    cards+='<div class="re-column-label" style="left:'+source.x+'px;width:'+cardWidth+'px">STAGE '+sourceStage.code+' — '+esc(sourceStage.label)+'</div>';
    columns.forEach(function(column){var stage=stageMeta[column.stage];cards+='<div class="re-column-label" style="left:'+xByStage[column.stage]+'px;width:'+cardWidth+'px">STAGE '+stage.code+' — '+esc(stage.label)+'</div>'});
    cards+='<div class="re-stamp" style="left:18px;top:'+(CY-310)+'px;transform:rotate(-5deg)">2025.04 七元素規制</div>';
    cards+='<div class="re-stamp" style="left:40px;top:'+(CY-277)+'px;transform:rotate(3deg)">2026.01 対日強化</div>';
    cards+='<button type="button" class="re-card re-stage-card" data-type="stage" data-id="1" data-node-id="stage01" aria-pressed="'+(selection.type==="stage"&&Number(selection.id)===1)+'" style="left:'+source.x+'px;top:'+(CY-41)+'px;width:'+source.w+'px"><div class="re-card-code">SOURCE / STAGE '+sourceStage.code+'</div><div class="re-card-title">'+esc(sourceStage.label)+'</div><div class="re-card-sub">'+esc(sourceStage.short)+'</div></button>';
    columns.forEach(function(column){var stage=stageMeta[column.stage];column.nodes.forEach(function(item){cards+=subCard(item,nodeMap[item.id],stage)})});
    var canvas=root.querySelector("#re-flow-canvas");
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    canvas.innerHTML=svg+cards;
    function traceEdges(id){
      canvas.classList.toggle("is-tracing",!!id);
      var edges=Array.from(canvas.querySelectorAll(".re-edge")),linked=new Set();
      function walk(direction,element){
        var frontier=[id],visited=new Set([id]);
        while(frontier.length){
          var node=frontier.pop();
          edges.forEach(function(edge){
            if(edge.dataset.element!==element)return;
            var matches=direction==="up"?edge.dataset.to===node:edge.dataset.from===node;
            if(!matches)return;
            linked.add(edge);
            var next=direction==="up"?edge.dataset.from:edge.dataset.to;
            if(!visited.has(next)){visited.add(next);frontier.push(next)}
          })
        }
        if(direction==="down")visited.forEach(function(node){
          edges.forEach(function(edge){if(!edge.dataset.element&&edge.dataset.from===node)linked.add(edge)})
        })
      }
      if(id)selectedElements.forEach(function(element){walk("up",element);walk("down",element)});
      edges.forEach(function(edge){edge.classList.toggle("is-linked",!!id&&linked.has(edge))})
    }
    traceEdges(traceNodeId);
    root.querySelectorAll("[data-type]").forEach(function(btn){btn.addEventListener("click",function(){
      var traceable=btn.dataset.type==="sub";
      traceNodeId=traceable?btn.dataset.id:null;
      selection={type:btn.dataset.type,id:btn.dataset.id};selectedId=null;render();
      if(traceable)requestAnimationFrame(function(){
        var heading=root.querySelector("#re-list-title");
        if(heading)heading.scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})
      })
    })})
  }

  function initResponsiveMap(){
    var viewport=root.querySelector("#re-flow-viewport"),lastWidth=Math.max(1200,Math.floor(viewport.clientWidth)),reflowTimer=null;
    function handleViewportResize(){
      var nextWidth=Math.max(1200,Math.floor(viewport.clientWidth));
      if(nextWidth===lastWidth)return;
      clearTimeout(reflowTimer);
      reflowTimer=setTimeout(function(){
        var currentWidth=Math.max(1200,Math.floor(viewport.clientWidth));
        if(currentWidth!==lastWidth){lastWidth=currentWidth;render()}
      },80)
    }
    if(window.ResizeObserver)new ResizeObserver(handleViewportResize).observe(viewport);
    else window.addEventListener("resize",handleViewportResize)
  }

  function subLabel(id){var sub=allSubs.find(function(item){return item.id===id});return sub?sub.label:id}
  function renderRouteNote(){
    var holder=root.querySelector("#re-route-note"),rows=[];
    if(selection.type==="sub"){
      var selected=allSubs.find(function(item){return item.id===selection.id});
      if(selected){
        (selected.src||[]).forEach(function(source){rows.push({from:source,to:selected.id,elements:selected.srcEls[source],note:selected.srcNotes[source]})});
        allSubs.forEach(function(target){if((target.src||[]).indexOf(selected.id)>=0)rows.push({from:selected.id,to:target.id,elements:target.srcEls[selected.id],note:target.srcNotes[selected.id]})})
      }
    }
    if(!rows.length){
      holder.innerHTML='<div class="re-route-note-title">END-TO-END ROUTE TRACE</div>サブカテゴリーカードの高さは登録社数に比例します。元素で絞り込むと該当カードを代表色で強調し、複数元素に該当するカードは分割配色します。全体表示では全ノードとすべての接続線を表示します。サブカテゴリーを選ぶと、同じ元素で連鎖する全上流・全下流Stageの接続を表示します。';
      return
    }
    holder.innerHTML='<div class="re-route-note-title">AUDITED DIRECT ROUTES — '+rows.length+' CONNECTIONS</div>'+rows.map(function(row){return'<div class="re-route-row"><span class="re-route-pair">'+esc(subLabel(row.from))+' → '+esc(subLabel(row.to))+'</span><span class="re-route-elements">'+tagsHtml(row.elements)+'</span><span>'+esc(row.note)+'</span></div>'}).join("")
  }

  function selectionLabel(){
    if(selection.type==="all")return"全体 — 全工程・全サブカテゴリー";
    if(selection.type==="stage"){
      var s=stages.find(function(x){return x.id===Number(selection.id)});
      return"工程 "+selection.id+" — "+s.label;
    }
    if(selection.type==="sub"){var q=allSubs.find(function(x){return x.id===selection.id});return"工程 "+q.stage+" — "+q.label}
    return"全体 — 全工程・全サブカテゴリー"
  }

  function dependencyDashboardHtml(){
    var rows=dependencyRows.filter(function(d){return selectedElements.indexOf(d.tag)>=0});
    function gradient(segments){var at=0;return"conic-gradient("+segments.map(function(s){var from=at;at+=s.value;return s.color+" "+from+"% "+at+"%"}).join(",")+")"}
    return'<section class="re-dep-dashboard" aria-label="希土類別の中国依存度">'+
      '<div class="re-dep-intro">円グラフは日本の輸入相手国構成を数量ベースで表示。Yは元素別実績、Dy・Tbは政府公表の重希土類区分、Sm・Scは日本の通関統計で元素別に分離できないため近接品目の代理指標です。</div>'+
      '<div class="re-dep-grid">'+rows.map(function(d){return '<article class="re-dep-card"><div class="re-dep-head"><div class="re-dep-element"><i style="background:'+colors[d.tag]+'"></i>'+esc(d.label)+'</div><span class="re-dep-badge">'+esc(d.quality)+'</span></div>'+
        '<div class="re-dep-metric">'+esc(d.metric)+'</div>'+
        '<div class="re-dep-pie" role="img" aria-label="'+esc(d.label)+'の中国比率'+d.china+'%" style="background:'+gradient(d.segments)+'"><div class="re-dep-pie-value"><strong>'+d.china+'%</strong><span>中国</span></div></div>'+
        '<div class="re-dep-legend">'+d.segments.map(function(s){return'<div class="re-dep-legend-item"><i style="background:'+s.color+'"></i><span>'+esc(s.name)+'</span><strong>'+s.value+'%</strong></div>'}).join("")+'</div>'+
        '<div class="re-dep-evidence">'+esc(d.evidence)+'<br><a class="re-dep-source" href="'+d.url+'" target="_blank" rel="noopener noreferrer">'+esc(d.source)+'</a></div></article>'
      }).join("")+'</div>'+
      '<div class="re-dep-note">データ品質：Sm・Scの円グラフは元素固有の輸入シェアではありません。<a class="re-dep-source" href="https://www.customs.go.jp/tariff/2024_04_01/data/j_28.htm" target="_blank" rel="noopener noreferrer">日本の輸入統計品目</a>は酸化Yを分離する一方、Dy・Tb・Sm・Scの化合物を個別分離していません。Scにはフィリピン由来中間体→日本精製という非中国ルートが確認されています（<a class="re-dep-source" href="https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-scandium.pdf" target="_blank" rel="noopener noreferrer">USGS MCS 2026</a>）。</div>'+
    '</section>'
  }

  function renderList(){
    var dependency=selection.type==="stage"&&Number(selection.id)===1;
    root.querySelector(".re-main").classList.toggle("is-dependency",dependency);
    if(dependency){
      root.querySelector("#re-list-title").textContent="工程 1 — 海外の資源・分離";
      root.querySelector("#re-list-count").textContent="公的統計・公的資料ベース";
      root.querySelector("#re-companies").innerHTML=dependencyDashboardHtml();
      return
    }
    var items=list();
    root.querySelector("#re-list-title").textContent=selectionLabel();
    root.querySelector("#re-list-count").textContent=items.length+"社・事業単位";
    var box=root.querySelector("#re-companies");
    if(!items.length){box.innerHTML='<div class="re-empty">この絞り込み条件では該当企業がありません。</div>';return}
    box.innerHTML=items.map(function(c){
      var tagHtml=c.tags.map(function(t){return'<span class="re-tag" style="color:'+colors[t]+';border-color:'+colors[t]+'">'+tagLabel(t)+'</span>'}).join("");
      if(c.atlaProcurement)tagHtml+='<span class="re-tag re-atla-badge">防衛装備庁調達実績あり</span>';
      var summary=companySummary(c);
      return'<button type="button" class="re-company" data-company="'+esc(c.id)+'" aria-pressed="'+(selectedId===c.id)+'"><div class="re-company-name">'+esc(c.name)+'</div><div class="re-tags">'+tagHtml+'</div><div class="re-company-pos" title="'+esc(summary.full)+'">'+esc(summary.short)+'</div></button>';
    }).join("");
    root.querySelectorAll("[data-company]").forEach(function(btn){btn.addEventListener("click",function(){selectedId=btn.dataset.company;renderList();renderDossier()})});
  }

  function renderDossier(){
    var host=root.querySelector("#re-dossier"),c=data.find(function(x){return x.id===selectedId});
    if(selection.type==="stage"&&Number(selection.id)===1){host.innerHTML="";return}
    if(!c){host.innerHTML='<div class="re-empty">企業カードを選択すると、所有構造・売上・製品・市場地位・防衛接続・中国依存を表示します。</div>';return}
    var subLabels=c.subs.map(function(id){var s=allSubs.find(function(x){return x.id===id});return(s||{label:id}).label}).join(" / ");
    var rows=[
      ["所有・上場",c.own],["売上規模",c.rev],["主要製品",c.prod],["市場での地位",marketPosition(c.pos)],
      ["防衛・航空宇宙",c.def],["防衛装備庁調達実績",c.atlaProcurement?"防衛装備庁調達実績あり":""],["調達品目判定（人力確認）",c.atla?c.atla.decision:""],["希土類判定（調達品目基準）",c.atla?c.atla.rareEarthFlags:""],["中国依存",c.chn],["BOM根拠",c.bom],["追加DDギャップ",c.gap],["帰属工程",c.stages.map(function(n){return"Stage 0"+n}).join(" / ")],
      ["サブカテゴリー",subLabels],["参照元",c.src],["注記",c.note]
    ].filter(function(r){return r[1]});
    host.innerHTML='<div class="re-dossier"><div class="re-dossier-title"><strong>'+esc(c.name)+'</strong></div><dl>'+rows.map(function(r){
      var display=(r[0]==="主要製品"||r[0]==="防衛・航空宇宙")?summarizeItems(r[1],5):{short:r[1],full:r[1],hidden:0};
      var more=display.hidden?'<details class="re-more"><summary>全'+(display.hidden+5)+'件を表示</summary><div>'+esc(display.full)+'</div></details>':'';
      return'<div class="re-dossier-row"><dt>'+esc(r[0])+'</dt><dd>'+esc(display.short)+more+'</dd></div>'
    }).join("")+'</dl></div>';
  }

  function render(){
    root.querySelectorAll("[data-element]").forEach(function(btn){
      var key=btn.dataset.element;
      var pressed=key==="all"?selectedElements.length===allElements.length:selectedElements.indexOf(key)>=0;
      btn.setAttribute("aria-pressed",String(pressed))
    });
    renderFlow();renderRouteNote();renderList();renderDossier()
  }
  root.querySelectorAll("[data-element]").forEach(function(btn){btn.addEventListener("click",function(){
    var key=btn.dataset.element;
    if(key==="all"){
      selectedElements=allElements.slice();selection={type:"all",id:"all"}
    }else if(selectedElements.length===allElements.length){
      selectedElements=[key]
    }else if(selectedElements.indexOf(key)>=0){
      if(selectedElements.length>1)selectedElements=selectedElements.filter(function(e){return e!==key})
    }else{
      selectedElements=selectedElements.concat(key)
    }
    traceNodeId=null;selectedId=null;render()
  })});
  root.querySelector("#re-status").textContent=data.length+"社・事業単位・6工程再構成版";
  render();initResponsiveMap()
})();
</script>
</body>
