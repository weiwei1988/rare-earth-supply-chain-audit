<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>希土類デュアルユース・サプライチェーン監査</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#ffffff;--panel:#f6f7f8;--panel-hi:#e9edf1;--line:#c9d0d7;
  --text:#101418;--sub:#4f5b66;--faint:#727d87;
  --y:#007f73;--dytb:#6654cc;--sm:#9a5a00;--sc:#006cab;
  --risk-a:#c43d28;--risk-b:#506a80;--risk-c:#806b00;--risk-x:#727d87
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1317;--panel:#171c22;--panel-hi:#1e252d;--line:#2a323b;
    --text:#e9e6dd;--sub:#9aa3ac;--faint:#6b7681;
    --y:#5fd4c4;--dytb:#9d8cff;--sm:#f2b24e;--sc:#55a8e8;
    --risk-a:#e4573d;--risk-b:#8ca3b8;--risk-c:#e0c36a;--risk-x:#6b7681
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#rare-earth-original-flow{background:var(--bg);color:var(--text);min-height:100vh}
.re-shell{max-width:1640px;margin:0 auto;padding:30px 24px 56px}
.re-kicker{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.19em;color:var(--faint)}
.re-title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:30px;font-weight:500;margin:7px 0 0}
.re-header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.re-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:15px}
button,.re-file-label{font:13px inherit;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover,.re-file-label:hover{background:var(--panel-hi);color:var(--text)}
button[aria-pressed="true"]{color:var(--text);border-color:var(--text);background:var(--panel-hi)}
button[data-element="Y"]{--re-filter-color:var(--y)}
button[data-element="DyTb"]{--re-filter-color:var(--dytb)}
button[data-element="Sm"]{--re-filter-color:var(--sm)}
button[data-element="Sc"]{--re-filter-color:var(--sc)}
button[data-element]:not([data-element="all"]){color:var(--re-filter-color);border-color:var(--re-filter-color)}
button[data-element]:not([data-element="all"]):hover{color:var(--re-filter-color);border-color:var(--re-filter-color);background:color-mix(in srgb,var(--re-filter-color) 14%,transparent)}
button[data-element]:not([data-element="all"])[aria-pressed="true"]{color:var(--bg);border-color:var(--re-filter-color);background:var(--re-filter-color)}
.re-file-label{border-radius:8px;color:var(--text);background:var(--panel-hi)}
.re-file-label input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.re-status{font-size:12px;color:var(--faint);margin-left:auto}
.re-legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--faint)}
.re-legend span{display:inline-flex;align-items:center;gap:5px}
.re-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.re-map-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1500px;margin:12px auto 0}
.re-map-help{font-size:11px;color:var(--faint);line-height:1.45}
.re-map-tools{display:flex;align-items:center;gap:6px;flex:none}
.re-map-tools button{border-radius:8px;padding:6px 10px;min-width:36px}
.re-map-scale{min-width:48px;text-align:center;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sub)}
.re-flow-wrap{position:relative;overflow:hidden;height:clamp(520px,72vh,900px);margin-top:8px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 35%,var(--bg));cursor:grab;touch-action:none;overscroll-behavior:contain}
.re-flow-wrap.is-dragging{cursor:grabbing;user-select:none}
.re-flow-wrap:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.re-flow-canvas{position:relative;width:1500px;min-height:1120px;margin:0;transform-origin:0 0;will-change:transform}
.re-flow-svg{position:absolute;inset:0;width:1500px;height:100%;pointer-events:none}
.re-path-bg{fill:none;stroke-width:8;stroke-linecap:round;opacity:.14}
.re-path-fg{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:4 8;opacity:.82}
.re-path-prime{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 6}
.re-edge{transition:opacity .12s ease}
.re-flow-canvas.is-tracing .re-edge:not(.is-linked){opacity:0!important}
.re-route-note{margin:4px auto 0;max-width:1500px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px;color:var(--sub);font-size:11px;line-height:1.55}
.re-route-note-title{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;color:var(--faint);margin-bottom:5px}
.re-route-row{display:grid;grid-template-columns:minmax(220px,350px) 68px 1fr;gap:9px;align-items:start;padding:4px 0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.re-route-row:first-of-type{border-top:0}
.re-route-pair{color:var(--text)}
.re-route-elements{display:flex;gap:4px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
.re-card{position:absolute;border-radius:10px;background:var(--panel);border:1.5px solid var(--line);color:var(--text);padding:10px 12px;text-align:left;white-space:normal}
.re-card:hover{transform:translateY(-1px)}
.re-card[aria-pressed="true"]{background:var(--panel-hi);border-color:var(--text)}
.re-card.is-dim{opacity:.22}
.re-stage-card{width:200px;height:90px}
.re-sub-card{width:200px;min-height:82px;padding:7px 10px 24px;overflow:hidden;transition:opacity .12s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease,transform .12s ease}
.re-sub-card.is-filter-match{background:var(--re-highlight-bg);border-color:var(--re-highlight-primary);box-shadow:0 0 0 1px color-mix(in srgb,var(--re-highlight-primary) 30%,transparent)}
.re-sub-card.is-filter-match::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--re-highlight-band)}
.re-sub-card.is-filter-match[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text),0 0 0 4px var(--re-highlight-primary)}
.re-mat-card{width:158px;height:70px}
.re-device-card{width:170px;height:58px}
.re-prime-card{width:180px;height:128px;border-style:dashed;background:transparent}
.re-card-code{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;color:var(--faint)}
.re-card-title{font-size:13px;font-weight:500;margin-top:7px;line-height:1.35}
.re-sub-card .re-card-code{font-size:9px;letter-spacing:.1em;white-space:nowrap}
.re-sub-card .re-card-title{font-size:12px;line-height:1.22;margin-top:4px;letter-spacing:-.01em}
.re-sub-card[data-id="03_ceramic"] .re-card-title,.re-sub-card[data-id="04_opt"] .re-card-title,.re-sub-card[data-id="05_engine"] .re-card-title{font-size:11px;line-height:1.2}
.re-sub-card[data-id="04_coat"] .re-card-title{font-size:10px;line-height:1.15;margin-top:3px;letter-spacing:-.03em}
.re-sub-card[data-id="05_energy"] .re-card-title{font-size:9px;line-height:1.1;margin-top:3px;letter-spacing:-.03em;padding-right:18px}
.re-card-sub{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.35}
.re-card-description{font-size:10px;color:var(--faint);margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.re-card-count{position:absolute;right:9px;bottom:7px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--sub)}
.re-card-tags{position:absolute;left:10px;bottom:6px;display:flex;gap:4px;margin:0;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1;white-space:nowrap}
.re-stamp{position:absolute;border:1.5px solid var(--risk-a);color:var(--risk-a);border-radius:4px;padding:3px 8px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:11px;background:var(--bg)}
.re-column-label{position:absolute;top:4px;width:220px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.35;letter-spacing:.12em;color:var(--faint)}
.re-detail-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:18px 0 12px}
.re-detail-head h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;font-weight:500;margin:0}
.re-detail-head span{font-size:12px;color:var(--faint)}
.re-main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.re-company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.re-main.is-dependency{grid-template-columns:1fr}
.re-main.is-dependency #re-companies{display:block}
.re-main.is-dependency #re-dossier{display:none}
.re-dep-dashboard{display:grid;gap:14px}
.re-dep-intro{font-size:12px;color:var(--sub);line-height:1.65;max-width:920px}
.re-dep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.re-dep-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;min-width:0}
.re-dep-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.re-dep-element{display:flex;align-items:center;gap:8px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.re-dep-element i{width:9px;height:9px;border-radius:50%;flex:none}
.re-dep-badge{border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--sub);white-space:nowrap}
.re-dep-metric{font-size:11px;color:var(--sub);line-height:1.45;margin-top:5px;min-height:32px}
.re-dep-pie{position:relative;width:132px;height:132px;border-radius:50%;margin:13px auto 11px}
.re-dep-pie::after{content:"";position:absolute;inset:25px;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
.re-dep-pie-value{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;pointer-events:none}
.re-dep-pie-value strong{font:500 24px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1}
.re-dep-pie-value span{font-size:9px;color:var(--faint);margin-top:5px}
.re-dep-legend{display:grid;gap:4px;margin-top:4px}
.re-dep-legend-item{display:grid;grid-template-columns:9px 1fr auto;gap:6px;align-items:center;font-size:10px;color:var(--sub)}
.re-dep-legend-item i{width:8px;height:8px;border-radius:50%}
.re-dep-legend-item strong{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
.re-dep-evidence{font-size:12px;color:var(--sub);line-height:1.6}
.re-dep-source{display:inline-block;margin-top:5px;color:var(--text);font-size:11px;text-underline-offset:3px}
.re-dep-note{font-size:11px;color:var(--faint);line-height:1.65}
.re-company{border-radius:10px;background:var(--panel);color:var(--text);border:1.5px solid var(--line);padding:12px 14px;text-align:left}
.re-company[aria-pressed="true"]{background:var(--panel-hi)}
.re-company-name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.re-risk-dot{width:9px;height:9px;border-radius:50%;flex:none}
.re-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.re-tag{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.re-atla-badge{color:var(--text);border-style:solid;font-family:inherit;font-weight:500}
.re-company-pos{font-size:12px;color:var(--sub);line-height:1.55;margin-top:7px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.re-dossier{position:sticky;top:14px;border:1px solid var(--line);border-top:3px solid var(--risk-c);border-radius:12px;background:var(--panel);padding:18px}
.re-empty{border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--faint);font-size:13px}
.re-dossier-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.re-dossier-title strong{font-size:17px;font-weight:500}
.re-dossier-title span{font-size:11px}
.re-dossier dl{margin:14px 0 0}
.re-dossier-row{display:grid;grid-template-columns:96px 1fr;gap:10px;border-top:1px solid var(--line);padding:8px 0}
.re-dossier dt{font-size:12px;color:var(--faint)}
.re-dossier dd{margin:0;font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.re-more{margin-top:5px}
.re-more summary{width:max-content;color:var(--sc);font-size:11px;cursor:pointer}
.re-more div{margin-top:6px;color:var(--sub)}
.re-error{color:var(--risk-a)}
@media(max-width:980px){.re-main{grid-template-columns:1fr}.re-dossier{position:static}}
@media(max-width:720px){.re-dep-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}}
@media(max-width:560px){.re-shell{padding:18px 12px 36px}.re-title{font-size:23px}.re-status{margin-left:0;width:100%}.re-company-grid{grid-template-columns:1fr}.re-route-row{grid-template-columns:1fr}.re-route-elements{margin-top:-5px}}
@media(prefers-reduced-motion:reduce){.re-card{transition:none}}
</style>
</head>

      <section class="re-company-grid" id="re-companies" aria-live="polite"></section>

    </main>
  </div>
</div>

      var common=Array.from(new Set(allowed||a.els)).filter(function(e){return a.els.indexOf(e)>=0&&b.els.indexOf(e)>=0});
      common.forEach(function(e){

      })
    }

    });

    function segmentedGradient(tags,angle,colorValue){
      if(tags.length===1)return colorValue(tags[0]);
      var stops=[];
      tags.forEach(function(tag,index){var start=index*100/tags.length,end=(index+1)*100/tags.length,color=colorValue(tag);stops.push(color+" "+start+"%",color+" "+end+"%")});

    }

      return'<button type="button" class="re-card re-sub-card'+(dim?" is-dim":"")+(highlight?" is-filter-match":"")+(matchedEls.length>1?" is-filter-multi":"")+'" data-type="'+type+'" data-id="'+item.id+'" data-node-id="'+item.id+'"'+(routeTitle?' title="'+esc(routeTitle)+'"':'')+' aria-pressed="'+(selection.type===type&&selection.id===item.id)+'" style="left:'+pos.x+'px;top:'+(pos.y-pos.h/2)+'px;height:'+pos.h+'px'+highlightVars(matchedEls)+'">'+
        '<div class="re-card-code">STAGE '+stageCode+' / '+(type==="use"?"機器":type==="mat"?"機能部材":"中間工程")+'</div><div class="re-card-title">'+esc(item.label)+'</div><div class="re-card-description">'+esc(item.description)+'</div><div class="re-card-tags">'+tagsHtml(pos.els)+'</div><span class="re-card-count">'+totalSubCount(item.id)+'社</span></button>'
    }

    var cards='';
    cards+='<div class="re-column-label" style="left:8px">STAGE 01 — 中国原料</div>';
    cards+='<div class="re-column-label" style="left:'+s2x+'px">STAGE 02 — 分離精製・高純度化／一次変換</div>';
    cards+='<div class="re-column-label" style="left:'+s3x+'px">STAGE 03 — 組成設計・用途別中間材料</div>';
    cards+='<div class="re-column-label" style="left:'+s4x+'px">STAGE 04 — 機能材料・部材／製造用消耗材</div>';
    cards+='<div class="re-column-label" style="left:'+s5x+'px">STAGE 05 — 機器・コンポーネント</div>';
    cards+='<div class="re-stamp" style="left:18px;top:'+(CY-310)+'px;transform:rotate(-5deg)">2025.04 七元素規制</div>';
    cards+='<div class="re-stamp" style="left:40px;top:'+(CY-277)+'px;transform:rotate(3deg)">2026.01 対日強化</div>';
    cards+='<button type="button" class="re-card re-stage-card" data-type="stage" data-id="1" data-node-id="stage01" aria-pressed="'+(selection.type==="stage")+'" style="left:'+source.x+'px;top:'+(CY-45)+'px"><div class="re-card-code">SOURCE / STAGE 01</div><div class="re-card-title">中国原料</div><div class="re-card-sub">採掘・分離精製・輸出管理</div></button>';
    s2nodes.forEach(function(s){cards+=subCard(s,s2map[s.id],"sub","02")});
    s3nodes.forEach(function(s){cards+=subCard(s,s3map[s.id],"sub","03")});
    s4nodes.forEach(function(s){cards+=subCard(s,s4map[s.id],"mat","04")});

    cards+='<button type="button" class="re-card re-prime-card" data-type="prime" data-id="prime" aria-pressed="'+(selection.type==="prime")+'" style="left:'+primeX+'px;top:'+(CY-64)+'px"><div class="re-card-code">OUT OF SCOPE / 枠外</div><div class="re-card-title">システム統合</div><div class="re-card-sub">三菱重工・川重・IHI・三菱電機・NEC 等</div></button>';
    var canvas=root.querySelector("#re-flow-canvas");
    canvas.style.height=H+"px";
    canvas.innerHTML=svg+cards;
    if(mapView.initialized)requestAnimationFrame(function(){if(mapView.autoFit)fitMapView();else applyMapView()});
    function traceEdges(id){
      canvas.classList.toggle("is-tracing",!!id);
      var edges=Array.from(canvas.querySelectorAll(".re-edge")),linked=new Set();
      function walk(direction,element){
        var frontier=[id],visited=new Set([id]);
        while(frontier.length){
          var node=frontier.pop();
          edges.forEach(function(edge){
            if(edge.dataset.element!==element)return;
            var matches=direction==="up"?edge.dataset.to===node:edge.dataset.from===node;
            if(!matches)return;
            linked.add(edge);
            var next=direction==="up"?edge.dataset.from:edge.dataset.to;
            if(!visited.has(next)){visited.add(next);frontier.push(next)}
          })
        }
        if(direction==="down")visited.forEach(function(node){
          edges.forEach(function(edge){if(!edge.dataset.element&&edge.dataset.from===node)linked.add(edge)})
        })
      }
      if(id)selectedElements.forEach(function(element){walk("up",element);walk("down",element)});
      edges.forEach(function(edge){edge.classList.toggle("is-linked",!!id&&linked.has(edge))})
    }
    traceEdges(traceNodeId);

  function clampMapView(){
    var viewport=root.querySelector("#re-flow-viewport"),canvas=root.querySelector("#re-flow-canvas"),margin=20;
    var vw=viewport.clientWidth,vh=viewport.clientHeight,cw=canvas.offsetWidth*mapView.scale,ch=canvas.offsetHeight*mapView.scale;
    if(cw<=vw)mapView.x=(vw-cw)/2;else mapView.x=Math.min(vw/2-margin,Math.max(vw/2-cw+margin,mapView.x));
    if(ch<=vh)mapView.y=(vh-ch)/2;else mapView.y=Math.min(vh/2-margin,Math.max(vh/2-ch+margin,mapView.y));
  }
  function applyMapView(){
    var canvas=root.querySelector("#re-flow-canvas"),scaleLabel=root.querySelector("#re-map-scale");
    clampMapView();
    canvas.style.transform="translate3d("+mapView.x+"px,"+mapView.y+"px,0) scale("+mapView.scale+")";
    scaleLabel.textContent=Math.round(mapView.scale*100)+"%";
  }
  function fitMapView(){
    var viewport=root.querySelector("#re-flow-viewport"),canvas=root.querySelector("#re-flow-canvas"),source=canvas.querySelector('[data-node-id="stage01"]');
    var sourceCenterX=source?source.offsetLeft+source.offsetWidth/2:canvas.offsetWidth/2;
    var sourceCenterY=source?source.offsetTop+source.offsetHeight/2:canvas.offsetHeight/2;
    mapView.scale=1;
    mapView.x=viewport.clientWidth/2-sourceCenterX*mapView.scale;
    mapView.y=viewport.clientHeight/2-sourceCenterY*mapView.scale;
    mapView.autoFit=true;
    applyMapView()
  }
  function zoomMap(nextScale,clientX,clientY){
    var viewport=root.querySelector("#re-flow-viewport"),rect=viewport.getBoundingClientRect();
    var px=clientX==null?viewport.clientWidth/2:clientX-rect.left,py=clientY==null?viewport.clientHeight/2:clientY-rect.top;
    var mapX=(px-mapView.x)/mapView.scale,mapY=(py-mapView.y)/mapView.scale;
    mapView.scale=Math.max(mapView.minScale,Math.min(mapView.maxScale,nextScale));
    mapView.x=px-mapX*mapView.scale;
    mapView.y=py-mapY*mapView.scale;
    mapView.autoFit=false;
    applyMapView()
  }
  function initMapView(){
    if(mapView.initialized)return;
    var viewport=root.querySelector("#re-flow-viewport"),zoomIn=root.querySelector("#re-map-zoom-in"),zoomOut=root.querySelector("#re-map-zoom-out"),fit=root.querySelector("#re-map-fit");
    mapView.initialized=true;
    zoomIn.addEventListener("click",function(){zoomMap(mapView.scale+.1)});
    zoomOut.addEventListener("click",function(){zoomMap(mapView.scale-.1)});
    fit.addEventListener("click",fitMapView);
    viewport.addEventListener("pointerdown",function(event){
      if(event.button!==0)return;
      mapView.dragging=true;mapView.moved=false;mapView.startClientX=event.clientX;mapView.startClientY=event.clientY;mapView.startX=mapView.x;mapView.startY=mapView.y;
      viewport.classList.add("is-dragging")
    });
    viewport.addEventListener("pointermove",function(event){
      if(!mapView.dragging)return;
      var dx=event.clientX-mapView.startClientX,dy=event.clientY-mapView.startClientY;
      if(Math.abs(dx)+Math.abs(dy)>4){mapView.moved=true;if(!viewport.hasPointerCapture(event.pointerId))viewport.setPointerCapture(event.pointerId)}
      mapView.x=mapView.startX+dx;mapView.y=mapView.startY+dy;mapView.autoFit=false;applyMapView();event.preventDefault()
    });
    function stopDrag(event){
      if(!mapView.dragging)return;
      mapView.dragging=false;viewport.classList.remove("is-dragging");
      if(viewport.hasPointerCapture(event.pointerId))viewport.releasePointerCapture(event.pointerId);
      if(mapView.moved){mapView.suppressClick=true;setTimeout(function(){mapView.suppressClick=false},0)}
    }
    viewport.addEventListener("pointerup",stopDrag);viewport.addEventListener("pointercancel",stopDrag);
    viewport.addEventListener("click",function(event){if(mapView.suppressClick){event.preventDefault();event.stopPropagation()}},true);
    viewport.addEventListener("wheel",function(event){
      event.preventDefault();
      if(event.ctrlKey||event.metaKey)zoomMap(mapView.scale*Math.exp(-event.deltaY*.002),event.clientX,event.clientY);
      else{mapView.x-=event.deltaX;mapView.y-=event.deltaY;mapView.autoFit=false;applyMapView()}
    },{passive:false});
    viewport.addEventListener("keydown",function(event){
      var handled=true,step=48;
      if(event.key==="ArrowLeft"){mapView.x+=step;mapView.autoFit=false;applyMapView()}
      else if(event.key==="ArrowRight"){mapView.x-=step;mapView.autoFit=false;applyMapView()}
      else if(event.key==="ArrowUp"){mapView.y+=step;mapView.autoFit=false;applyMapView()}
      else if(event.key==="ArrowDown"){mapView.y-=step;mapView.autoFit=false;applyMapView()}
      else if(event.key==="+"||event.key==="=")zoomMap(mapView.scale+.1);
      else if(event.key==="-"||event.key==="_")zoomMap(mapView.scale-.1);
      else if(event.key==="0")fitMapView();
      else handled=false;
      if(handled)event.preventDefault()
    });
    if(window.ResizeObserver)new ResizeObserver(function(){if(mapView.autoFit)fitMapView();else applyMapView()}).observe(viewport);
    else window.addEventListener("resize",function(){if(mapView.autoFit)fitMapView();else applyMapView()});
    requestAnimationFrame(fitMapView)
  }

    var rows=[
      ["所有・上場",c.own],["売上規模",c.rev],["主要製品",c.prod],["シェア・地位",c.pos],
      ["防衛・航空宇宙",c.def],["防衛装備庁調達実績",c.atlaProcurement?"防衛装備庁調達実績あり":""],["工程5判定（調達品目基準）",c.atla?c.atla.decision:""],["ユーザー判定",c.atla?c.atla.userReason:""],["希土類判定（調達品目基準）",c.atla?c.atla.rareEarthFlags:""],["中国依存",c.chn],["BOM根拠",c.bom],["追加DDギャップ",c.gap],["帰属工程",c.stages.map(function(n){return"Stage 0"+n}).join(" / ")],
      ["サブカテゴリー",subLabels],["参照元",c.src],["注記",c.note]
    ].filter(function(r){return r[1]});
    host.innerHTML='<div class="re-dossier" style="border-top-color:'+risk[e]+'"><div class="re-dossier-title"><strong>'+esc(c.name)+'</strong><span style="color:'+risk[e]+'">'+riskLabel[e]+'</span></div><dl>'+rows.map(function(r){
      var display=(r[0]==="主要製品"||r[0]==="防衛・航空宇宙")?summarizeItems(r[1],5):{short:r[1],full:r[1],hidden:0};
      var more=display.hidden?'<details class="re-more"><summary>全'+(display.hidden+5)+'件を表示</summary><div>'+esc(display.full)+'</div></details>':'';
      return'<div class="re-dossier-row"><dt>'+esc(r[0])+'</dt><dd>'+esc(display.short)+more+'</dd></div>'
    }).join("")+'</dl></div>';
  }

  function parseWorkbook(file){
    if(!window.XLSX)return Promise.reject(new Error("Excel読込ライブラリを取得できません。インターネット接続を確認してください"));
    return file.arrayBuffer().then(function(buffer){
      var wb=XLSX.read(buffer,{type:"array"}),name=wb.SheetNames.find(function(n){return/正式採用リスト|統合企業一覧|企業一覧/.test(n)})||wb.SheetNames[0],sheet=wb.Sheets[name];
      var matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:false});
      var hr=matrix.findIndex(function(row){var cs=row.map(compact);return cs.some(function(v){return v.indexOf("企業名")>=0})&&cs.some(function(v){return v==="Stage01"})});
      if(hr<0)throw new Error("統合企業一覧のヘッダー行を検出できません");
      var headers=matrix[hr].map(function(v){return String(v||"").trim()}),norm=headers.map(compact);
      function idx(){for(var a=0;a<arguments.length;a++){var t=compact(arguments[a]),i=norm.indexOf(t);if(i>=0)return i;i=norm.findIndex(function(h){return h.indexOf(t)>=0});if(i>=0)return i}return-1}
      function at(row){var names=Array.prototype.slice.call(arguments,1),i=idx.apply(null,names);return i>=0?row[i]:""}
      var parsed=matrix.slice(hr+1).map(function(row,i){
        var name=at(row,"企業名（統合）","企業名");if(!String(name).trim())return null;
        var st=[1,2,3,4,5].filter(function(n){return truthy(at(row,"Stage0"+n,"Stage"+n))});
        var subText=String(at(row,"サブカテゴリー")||"");
        var subIds=allSubs.filter(function(s){return truthy(at(row,s.header||((s.id.indexOf("04_")===0?"04 ":"05 ")+s.label),s.label))||compact(subText).indexOf(compact(s.header||s.label))>=0||compact(subText).indexOf(compact(s.label))>=0||(s.id==="02_trade"&&(truthy(at(row,"02 原料商流・品質保証","原料商流・品質保証"))||compact(subText).indexOf(compact("原料商流・品質保証"))>=0))}).map(function(s){return s.id});
        subIds.forEach(function(id){var n=Number(id.slice(0,2));if(st.indexOf(n)<0)st.push(n)});
        var tags=["Y","DyTb","Sm","Sc"].filter(function(t){return truthy(at(row,t,t==="DyTb"?"Dy/Tb":t))});
        return{id:"xlsx-"+i,name:String(name).trim(),stages:st,subs:subIds,tags:tags,own:String(at(row,"所有・上場")||""),rev:String(at(row,"売上高","売上規模")||""),prod:String(at(row,"主要製品・役割","主要製品")||""),pos:String(at(row,"市場地位・ニッチ性","市場地位","シェア・地位")||""),def:String(at(row,"航空・宇宙・防衛接続","防衛・航空宇宙")||""),bom:String(at(row,"希土類BOM根拠","BOM根拠")||""),chn:String(at(row,"中国依存・DD論点","中国依存評価","中国依存")||""),gap:String(at(row,"追加DDギャップ")||""),ev:ev(at(row,"証拠ランク")),exc:truthy(at(row,"売上例外")),src:String(at(row,"参照元","一次資料")||""),note:String(at(row,"備考","注記")||""),formal:truthy(at(row,"正式採用","正式採用フラグ")),formalSource:String(at(row,"採用元","正式採用根拠")||"")};
      }).filter(Boolean);
      if(!parsed.length)throw new Error("企業データを読み込めませんでした");
      return{rows:parsed,mode:/正式採用リスト/.test(name)?"formal":"replace"};
    })
  }

  function render(){
    root.querySelectorAll("[data-element]").forEach(function(btn){
      var key=btn.dataset.element;
      var pressed=key==="all"?selectedElements.length===allElements.length:selectedElements.indexOf(key)>=0;
      btn.setAttribute("aria-pressed",String(pressed))
    });
    renderFlow();renderRouteNote();renderList();renderDossier()
  }
  root.querySelectorAll("[data-element]").forEach(function(btn){btn.addEventListener("click",function(){
    var key=btn.dataset.element;
    if(key==="all"){
      selectedElements=allElements.slice();selection={type:"all",id:"all"}
    }else if(selectedElements.length===allElements.length){
      selectedElements=[key]
    }else if(selectedElements.indexOf(key)>=0){
      if(selectedElements.length>1)selectedElements=selectedElements.filter(function(e){return e!==key})
    }else{
      selectedElements=selectedElements.concat(key)
    }
    traceNodeId=null;selectedId=null;render()
  })});
  root.querySelector("#re-reset").addEventListener("click",function(){data=seed.slice();selectedElements=allElements.slice();selection={type:"all",id:"all"};traceNodeId=null;selectedId=null;root.querySelector("#re-status").textContent=data.length+"社・事業単位・統合DD初期データ";root.querySelector("#re-xlsx").value="";render()});
  root.querySelector("#re-xlsx").addEventListener("change",function(event){
    var file=event.target.files&&event.target.files[0];if(!file)return;
    root.querySelector("#re-status").textContent="読込中…";
    parseWorkbook(file).then(function(result){data=result.mode==="formal"?mergeCompanyRows(seed,result.rows):result.rows;selectedId=null;root.querySelector("#re-status").textContent=data.length+"社・事業単位・"+file.name;render()}).catch(function(error){root.querySelector("#re-status").innerHTML='<span class="re-error">読込エラー: '+esc(error.message)+'</span>'})
  });
  root.querySelector("#re-status").textContent=data.length+"社・事業単位・Stage 05統合企業リスト反映版";
  render();initMapView()
})();
</script>
